<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO | Physical Analytics</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #070D18;
      --bg-card: rgba(15, 23, 42, 0.75);
      --lucero-navy: #0B192C;
      --lucero-gold: #FFD700;
      --lucero-gold-glow: rgba(255, 215, 0, 0.35);
      --lucero-gold-dark: #CFA600;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-glow: rgba(255, 215, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top center, #11223A 0%, var(--bg-dark) 70%);
      min-height: 100vh;
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 30px 20px 10px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--lucero-gold);
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--lucero-gold-glow);
      margin: 0;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--lucero-gold), transparent);
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 0;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--lucero-gold);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--lucero-gold);
    }

    .input-group { margin-bottom: 16px; }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(7, 13, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    button {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--lucero-gold) 0%, var(--lucero-gold-dark) 100%);
      color: #070D18;
      font-size: 15px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--lucero-gold-glow);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .metric-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .metric-label { font-size: 11px; color: var(--text-sub); display: block; }
    .metric-value { font-size: 16px; font-weight: 700; color: #FFFFFF; }

    .badge-ok {
      color: #070D18; background: var(--lucero-gold);
      padding: 2px 8px; border-radius: 4px; font-weight: 900;
    }

    .badge-ng {
      color: #94A3B8; background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px; border-radius: 4px; font-weight: 700;
    }

    /* データテーブルスタイル */
    .data-table-container {
      overflow-x: auto;
      margin-top: 10px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      color: #FFFFFF;
      text-align: center;
    }

    .history-table th, .history-table td {
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 6px;
      white-space: nowrap;
    }

    .history-table th {
      background: rgba(255, 215, 0, 0.15);
      color: var(--lucero-gold);
      font-weight: 700;
    }

    #loading-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(7, 13, 24, 0.9); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999;
    }

    .ball-spinner { font-size: 56px; animation: spinBall 1.2s linear infinite; }
    .loading-text { font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--lucero-gold); }

    @keyframes spinBall { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="loading-overlay" class="hidden">
    <div class="ball-spinner">⚽</div>
    <div class="loading-text">NOW LOADING...</div>
  </div>

  <header>
    <div class="brand-title">LUCERO KYOTO</div>
    <div class="brand-subtitle">Physical Data Analytics Portal</div>
  </header>

  <div class="container">
    
    <!-- ログイン画面 -->
    <div id="login-view" class="card" style="max-width: 400px; margin: 40px auto;">
      <h2 style="justify-content: center;">ATHLETE LOGIN</h2>
      <div class="input-group">
        <input type="text" id="userId" placeholder="ユーザーID (選手ID)">
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="パスワード">
      </div>
      <button style="width:100%;" id="loginBtn" onclick="handleLogin()">ログイン</button>
    </div>

    <!-- ダッシュボード本体 -->
    <div id="dashboard" class="hidden">
      
      <div style="margin-bottom: 20px;">
        <h1 id="welcome-msg" style="font-size: 24px; color: #FFFFFF; margin: 0; font-weight: 900;"></h1>
        <p style="color: var(--text-sub); font-size: 13px; margin: 2px 0 0 0;">フィジカル測定データ & パフォーマンス変遷</p>
      </div>

      <div id="display-container">
        
        <!-- 最新記録 -->
        <div class="card">
          <h2>LATEST RECORD (<span id="latest-date" style="color: var(--lucero-gold);">-</span>)</h2>
          <div id="latest-metrics" class="metric-grid"></div>
        </div>

        <!-- 測定履歴一覧テーブル -->
        <div class="card">
          <h2>MEASUREMENT HISTORY (全データ一覧)</h2>
          <div id="history-table-box" class="data-table-container"></div>
        </div>

        <!-- パフォーマンスチャート -->
        <div class="card">
          <h2>PERFORMANCE CHART (個人値 vs 中央値)</h2>
          <div class="input-group">
            <label for="metricSelect" style="font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px;">表示項目を選択</label>
            <select id="metricSelect" onchange="updateChart()"></select>
          </div>
          <div style="position: relative; height: 320px; margin-top: 15px;">
            <canvas id="growthChart"></canvas>
          </div>
        </div>

      </div>

    </div>

  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycby_butvXxqK1Jszi37nZE97DVATb8IXVNT3ncGeuqBIrJARWk2vImctf7FF-dFVaX99/exec"; 
  let playerData = null;

  function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
  function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

  function getTimeFromDateStr(str) {
    if (!str) return 0;
    const clean = str.replace(/年|月/g, '/').replace(/日/g, '').replace(/\./g, '/').trim();
    const t = new Date(clean).getTime();
    return isNaN(t) ? 0 : t;
  }

  async function handleLogin() {
    const userId = document.getElementById('userId').value;
    const password = document.getElementById('password').value;

    if(!userId || !password) {
      alert("IDとパスワードを入力してください");
      return;
    }

    showLoading();

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', userId, password })
      });
      const result = await res.json();

      if (result.success) {
        await loadDashboardData(userId);
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
      } else {
        alert(result.message);
      }
    } catch(e) {
      alert("通信エラーが発生しました");
    } finally {
      hideLoading();
    }
  }

  async function loadDashboardData(userId) {
    try {
      const res = await fetch(`${GAS_URL}?action=getData&userId=${userId}`);
      playerData = await res.json();

      if (playerData.error) {
        alert(playerData.error);
        return;
      }

      document.getElementById('welcome-msg').innerText = `${playerData.name} 選手`;

      if (playerData.history && playerData.history.length > 0) {
        // 日付降順（最新が先頭）にソート
        playerData.history.sort((a, b) => {
          const timeA = a.timestamp || getTimeFromDateStr(a.date);
          const timeB = b.timestamp || getTimeFromDateStr(b.date);
          return timeB - timeA;
        });

        renderLatest(playerData.history[0]);
        renderTable(playerData.history);
        setupMetricSelect(playerData.history);
      }
    } catch(e) {
      console.error(e);
      alert("データの読み込みに失敗しました。");
    }
  }

  function formatValue(val) {
    if (val === '○' || val === '◯') return '<span class="badge-ok">CLEAR</span>';
    if (val === '×') return '<span class="badge-ng">NO CLEAR</span>';
    return val !== undefined && val !== null ? val : '-';
  }

  function renderLatest(latest) {
    document.getElementById('latest-date').innerText = latest.date;
    let html = '';
    for (let [key, val] of Object.entries(latest.metrics)) {
      html += `
        <div class="metric-item">
          <span class="metric-label">${key}</span>
          <span class="metric-value">${formatValue(val)}</span>
        </div>`;
    }
    document.getElementById('latest-metrics').innerHTML = html;
  }

  // 全データ一覧の表（テーブル）レンダリング
  function renderTable(history) {
    if (!history || history.length === 0) return;
    
    // 全項目（キー）を取得
    const keys = Object.keys(history[0].metrics);
    
    let html = `<table class="history-table"><thead><tr><th>回数</th><th>測定日</th>`;
    keys.forEach(k => { html += `<th>${k}</th>`; });
    html += `</tr></thead><tbody>`;

    // 昇順（古い順）でテーブルを作成
    const ascHistory = history.slice().reverse();
    ascHistory.forEach((item, index) => {
      html += `<tr><td>${index + 1}</td><td>${item.date}</td>`;
      keys.forEach(k => {
        const val = item.metrics[k];
        html += `<td>${formatValue(val)}</td>`;
      });
      html += `</tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('history-table-box').innerHTML = html;
  }

  function setupMetricSelect(history) {
    const select = document.getElementById('metricSelect');
    select.innerHTML = '';

    let numericKeys = new Set();
    history.forEach(h => {
      for (let [key, val] of Object.entries(h.metrics)) {
        if (!isNaN(parseFloat(val)) && isFinite(val)) {
          numericKeys.add(key);
        }
      }
    });

    numericKeys.forEach(key => {
      let opt = document.createElement('option');
      opt.value = key;
      opt.innerText = key;
      select.appendChild(opt);
    });

    updateChart();
  }

  function updateChart() {
    const selectedMetric = document.getElementById('metricSelect').value;
    if (!selectedMetric || !playerData || !playerData.history) return;

    // グラフ用には昇順（古い日付→新しい日付）
    const chronologicalHistory = playerData.history.slice().sort((a, b) => {
      const timeA = a.timestamp || getTimeFromDateStr(a.date);
      const timeB = b.timestamp || getTimeFromDateStr(b.date);
      return timeA - timeB;
    });

    const labels = [];
    const personalData = [];
    const medianData = [];

    chronologicalHistory.forEach(h => {
      labels.push(h.date);
      
      // 個人数値
      const pVal = parseFloat(h.metrics[selectedMetric]);
      personalData.push(!isNaN(pVal) ? pVal : null);

      // 中央値
      if (h.medians && h.medians[selectedMetric] !== undefined) {
        const mVal = parseFloat(h.medians[selectedMetric]);
        medianData.push(!isNaN(mVal) ? mVal : null);
      } else {
        medianData.push(null);
      }
    });

    renderChart(selectedMetric, labels, personalData, medianData);
  }

  function renderChart(metricName, labels, personalData, medianData) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    if (window.myChart) window.myChart.destroy();

    const datasets = [
      {
        label: `${playerData.name} 選手 (記録)`,
        data: personalData,
        borderColor: '#FFD700',
        backgroundColor: 'rgba(255, 215, 0, 0.15)',
        pointBackgroundColor: '#FFD700',
        pointBorderColor: '#070D18',
        pointBorderWidth: 2,
        pointRadius: 5,
        fill: true,
        tension: 0.3
      }
    ];

    // 中央値データが存在する場合は破線グラフで追加
    if (medianData.some(v => v !== null)) {
      datasets.push({
        label: '期別 中央値',
        data: medianData,
        borderColor: '#94A3B8',
        borderDash: [6, 6],
        pointBackgroundColor: '#94A3B8',
        pointRadius: 4,
        fill: false,
        tension: 0.3
      });
    }

    window.myChart = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: '#FFFFFF', font: { family: 'Noto Sans JP', weight: 'bold' } }
          }
        },
        scales: {
          x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94A3B8' } },
          y: { grid: { color: 'rgba(255, 255, 255, 0.08)' }, ticks: { color: '#94A3B8' }, beginAtZero: false }
        }
      }
    });
  }
</script>
</body>
</html>

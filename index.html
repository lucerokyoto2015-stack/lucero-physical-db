<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO Physical Data Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --lucero-navy: #0B192C;
      --lucero-gold: #FFD700;
      --lucero-gold-hover: #E6C200;
      --lucero-light-bg: #F4F6F9;
      --lucero-text: #1E293B;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ Pro W3', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--lucero-navy);
      color: #ffffff;
      line-height: 1.6;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      color: var(--lucero-text);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border-top: 4px solid var(--lucero-gold);
    }

    h1, h2, h3 {
      color: var(--lucero-navy);
      margin-top: 0;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      max-width: 300px;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      box-sizing: border-box;
      display: block;
    }

    button {
      background-color: var(--lucero-gold);
      color: var(--lucero-navy);
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--lucero-gold-hover);
      transform: translateY(-1px);
    }

    details {
      background: var(--lucero-light-bg);
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--lucero-navy);
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      color: var(--lucero-navy);
    }

    ul {
      list-style: none;
      padding-left: 0;
      margin-top: 8px;
    }

    li {
      padding: 4px 0;
      border-bottom: 1px dashed #E2E8F0;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- ログイン画面 -->
    <div id="login-view" class="card">
      <h2>LUCERO 選手ログイン</h2>
      <input type="text" id="userId" placeholder="ユーザーID">
      <input type="password" id="password" placeholder="パスワード">
      <button onclick="handleLogin()">ログイン</button>
    </div>

    <!-- ダッシュボード画面 -->
    <div id="dashboard" class="hidden">
      <h1 id="welcome-msg" style="color: #ffffff;"></h1>

      <!-- 最新の記録 -->
      <div class="card">
        <h2>最新の記録 (<span id="latest-date">-</span>)</h2>
        <div id="latest-metrics"></div>
      </div>

      <!-- 過去の記録（アコーディオン） -->
      <div class="card">
        <h2>過去の記録一覧</h2>
        <div id="history-accordion"></div>
      </div>

      <!-- 成績の変遷（グラフ） -->
      <div class="card">
        <h2>成績の変遷（グラフ）</h2>
        <canvas id="growthChart"></canvas>
      </div>
    </div>

  </div>

<script>
  // STEP 2で取得したGASのWebアプリURLに差し替えてください
  const GAS_URL = "https://script.google.com/macros/s/AKfycby_butvXxqK1Jszi37nZE97DVATb8IXVNT3ncGeuqBIrJARWk2vImctf7FF-dFVaX99/exec"; 
  let playerData = null;

  async function handleLogin() {
    const userId = document.getElementById('userId').value;
    const password = document.getElementById('password').value;

    if(!userId || !password) {
      alert("IDとパスワードを入力してください");
      return;
    }

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', userId, password })
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadDashboardData(userId);
      } else {
        alert(result.message);
      }
    } catch(e) {
      alert("通信エラーが発生しました");
    }
  }

  async function loadDashboardData(userId) {
    const res = await fetch(`${GAS_URL}?action=getData&userId=${userId}`);
    playerData = await res.json();

    document.getElementById('welcome-msg').innerText = `${playerData.name} 選手のフィジカルデータ`;

    if (playerData.history && playerData.history.length > 0) {
      renderLatest(playerData.history[0]);
      renderAccordion(playerData.history);
      renderChart(playerData.history);
    }
  }

  function renderLatest(latest) {
    document.getElementById('latest-date').innerText = latest.date;
    let html = '<ul>';
    for (let [key, val] of Object.entries(latest.metrics)) {
      html += `<li><strong>${key}:</strong> ${val}</li>`;
    }
    html += '</ul>';
    document.getElementById('latest-metrics').innerHTML = html;
  }

  function renderAccordion(history) {
    let html = '';
    history.forEach(item => {
      html += `<details><summary>${item.date}</summary><ul>`;
      for (let [key, val] of Object.entries(item.metrics)) {
        html += `<li>${key}: ${val}</li>`;
      }
      html += '</ul></details>';
    });
    document.getElementById('history-accordion').innerHTML = html;
  }

  function renderChart(history) {
    const reversedHistory = [...history].reverse();
    const labels = reversedHistory.map(h => h.date);
    
    const firstMetric = Object.keys(reversedHistory[0].metrics)[0]; 
    const dataPoints = reversedHistory.map(h => h.metrics[firstMetric]);

    const ctx = document.getElementById('growthChart').getContext('2d');
    
    if (window.myChart) {
      window.myChart.destroy();
    }

    window.myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: firstMetric,
          data: dataPoints,
          borderColor: '#0B192C',
          backgroundColor: 'rgba(255, 215, 0, 0.2)',
          pointBackgroundColor: '#FFD700',
          pointBorderColor: '#0B192C',
          pointRadius: 5,
          fill: true,
          tension: 0.2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: {
              color: '#0B192C',
              font: { weight: 'bold' }
            }
          }
        }
      }
    });
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO | Physical Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0B121E;
      --bg-card: rgba(15, 23, 38, 0.85);
      --lucero-gold: #FFD700;
      --text-main: #FFFFFF;
      --text-sub: #94A3B8;
      --border-card: rgba(255, 215, 0, 0.2);
      --border-item: rgba(255, 255, 255, 0.08);
      --bg-item: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top center, #111C2E 0%, var(--bg-dark) 80%);
      min-height: 100vh;
      color: var(--text-main);
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    .site-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .site-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: var(--lucero-gold);
      letter-spacing: 2px;
      margin: 0;
    }

    .site-subtitle {
      font-size: 11px;
      color: var(--text-sub);
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .login-container {
      max-width: 400px;
      margin: 40px auto 0 auto;
    }

    .login-input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-item);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
    }

    .login-input:focus {
      border-color: var(--lucero-gold);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--lucero-gold);
      color: #0F1726;
      border: none;
      border-radius: 8px;
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: #F87171;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
    }

    .section-title {
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--lucero-gold);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--lucero-gold);
    }

    .date-highlight {
      color: var(--lucero-gold);
      margin: 0 4px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    @media (max-width: 768px) {
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .metric-item {
      background: var(--bg-item);
      border: 1px solid var(--border-item);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 72px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value-container {
      display: flex;
      align-items: center;
      min-height: 28px;
    }

    .metric-value-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 12px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
      min-width: 85px;
    }

    .badge-clear {
      background-color: #FFD700;
      color: #0F1726;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .badge-noclear {
      background-color: rgba(255, 255, 255, 0.12);
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .accordion-item {
      background: var(--bg-item);
      border: 1px solid var(--border-item);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .accordion-header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--lucero-gold);
      user-select: none;
    }

    .accordion-header:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .accordion-icon {
      font-size: 18px;
      color: var(--text-sub);
      transition: transform 0.3s ease;
    }

    .accordion-item.active .accordion-icon {
      transform: rotate(45deg);
    }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      padding: 0 20px;
    }

    .accordion-item.active .accordion-body {
      padding: 10px 20px 20px 20px;
      max-height: 1000px;
    }

    #loading {
      text-align: center;
      padding: 50px;
      font-size: 16px;
      color: var(--lucero-gold);
      font-family: 'Orbitron', sans-serif;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="site-header">
      <h1 class="site-title">LUCERO KYOTO</h1>
      <div class="site-subtitle">PHYSICAL DATA ANALYTICS PORTAL</div>
    </div>

    <!-- ATHLETE LOGIN -->
    <div id="login-view" class="card login-container" style="display: block;">
      <h2 class="section-title">ATHLETE LOGIN</h2>
      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="text" id="user-id" class="login-input" placeholder="ユーザーID (または選手名)" required>
        <input type="password" id="password" class="login-input" placeholder="パスワード" required>
        <button type="submit" class="login-btn">ログイン</button>
      </form>
      <div id="login-error" class="error-msg"></div>
    </div>

    <!-- LOADING -->
    <div id="loading">LOADING DATA...</div>

    <!-- DASHBOARD -->
    <div id="app-content" style="display: none;">
      <div class="card">
        <h2 class="section-title">
          LATEST RECORD ( <span id="latest-date" class="date-highlight">--</span> )
        </h2>
        <div id="latest-grid" class="metric-grid"></div>
      </div>

      <div class="card">
        <h2 class="section-title">MEASUREMENT HISTORY</h2>
        <div id="history-accordion"></div>
      </div>
    </div>
  </div>

  <script>
    // ★ ここをご自身の GAS ウェブアプリ URL（末尾 /exec）に打ち換えてください
    const GAS_URL =　"https://script.google.com/macros/s/AKfycby_butvXxqK1Jszi37nZE97DVATb8IXVNT3ncGeuqBIrJARWk2vImctf7FF-dFVaX99/exec"; 

    function formatValueHtml(val) {
      if (val === undefined || val === null || val === '') return '-';
      
      if (val === 'CLEAR') {
        return '<span class="badge badge-clear">CLEAR</span>';
      }
      if (val === 'NO CLEAR' || val === 'NOT CLEAR' || val === 'NOTCLEAR' || val === 'NOCLEAR') {
        return '<span class="badge badge-noclear">NO CLEAR</span>';
      }

      if (typeof val === 'number') {
        return `<span class="metric-value-text">${Number.isInteger(val) ? val : val.toFixed(2)}</span>`;
      }

      return `<span class="metric-value-text">${val}</span>`;
    }

    function getLatestValue(history, metricKey) {
      for (let i = history.length - 1; i >= 0; i--) {
        const val = history[i].metrics[metricKey];
        if (val !== undefined && val !== null && val !== '') {
          return val;
        }
      }
      return null;
    }

    function toggleAccordion(element) {
      const item = element.parentElement;
      item.classList.toggle('active');
    }

    function loadData(userId, password) {
      const loginView = document.getElementById('login-view');
      const loading = document.getElementById('loading');
      const loginError = document.getElementById('login-error');

      if (loginView) loginView.style.display = 'none';
      if (loading) loading.style.display = 'block';

      if (!GAS_URL || GAS_URL === "YOUR_GAS_DEPLOY_URL_HERE" || !GAS_URL.startsWith("http")) {
        if (loading) loading.style.display = 'none';
        if (loginView) loginView.style.display = 'block';
        if (loginError) loginError.textContent = 'GAS_URLが正しく設定されていません。コード内のURLを確認してください。';
        return;
      }

      const requestUrl = `${GAS_URL}?action=getData&userId=${encodeURIComponent(userId)}&password=${encodeURIComponent(password || '')}`;

      fetch(requestUrl)
        .then(res => res.json())
        .then(data => {
          if (loading) loading.style.display = 'none';
          if (!data || !data.history || data.history.length === 0) {
            if (loginView) loginView.style.display = 'block';
            if (loginError) loginError.textContent = (data && data.message) ? data.message : '該当するデータが見つかりませんでした。';
            return;
          }
          renderApp(data);
        })
        .catch(err => {
          console.error('Fetch Error:', err);
          if (loading) loading.style.display = 'none';
          if (loginView) loginView.style.display = 'block';
          if (loginError) loginError.textContent = '通信エラーが発生しました。GAS URLやアクセス権限（「全員」設定）を確認してください。';
        });
    }

    function handleLogin(event) {
      event.preventDefault();
      const userId = document.getElementById('user-id').value.trim();
      const password = document.getElementById('password').value.trim();
      if (userId) {
        document.getElementById('login-error').textContent = '';
        loadData(userId, password);
      }
    }

    function renderApp(data) {
      const appContent = document.getElementById('app-content');
      if (appContent) appContent.style.display = 'block';

      const history = data.history;
      const latestData = history[history.length - 1];

      const latestDateEl = document.getElementById('latest-date');
      if (latestDateEl) latestDateEl.textContent = latestData.date;

      const allHeaders = new Set();
      history.forEach(item => {
        Object.keys(item.metrics).forEach(key => allHeaders.add(key));
      });
      const headerList = Array.from(allHeaders);

      const latestGrid = document.getElementById('latest-grid');
      if (latestGrid) {
        latestGrid.innerHTML = '';
        headerList.forEach(header => {
          const val = getLatestValue(history, header);
          const itemDiv = document.createElement('div');
          itemDiv.className = 'metric-item';
          itemDiv.innerHTML = `
            <div class="metric-label">${header}</div>
            <div class="metric-value-container">${formatValueHtml(val)}</div>
          `;
          latestGrid.appendChild(itemDiv);
        });
      }

      const historyAccordion = document.getElementById('history-accordion');
      if (historyAccordion) {
        historyAccordion.innerHTML = '';
        const reverseHistory = history.slice().reverse();

        reverseHistory.forEach((item) => {
          const accordionItem = document.createElement('div');
          accordionItem.className = 'accordion-item';

          let gridHtml = '<div class="metric-grid">';
          headerList.forEach(header => {
            const val = item.metrics[header];
            gridHtml += `
              <div class="metric-item">
                <div class="metric-label">${header}</div>
                <div class="metric-value-container">${formatValueHtml(val)}</div>
              </div>
            `;
          });
          gridHtml += '</div>';

          accordionItem.innerHTML = `
            <div class="accordion-header" onclick="toggleAccordion(this)">
              <span>${item.date}</span>
              <span class="accordion-icon">+</span>
            </div>
            <div class="accordion-body">
              ${gridHtml}
            </div>
          `;

          historyAccordion.appendChild(accordionItem);
        });
      }
    }
  </script>
</body>
</html>

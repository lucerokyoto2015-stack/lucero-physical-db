<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO Physical Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0b1325;
      --card-bg: #131e3a;
      --card-border: rgba(255, 215, 0, 0.25);
      --accent-gold: #ffd700;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px 10px; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; }
    .hidden { display: none !important; }

    /* ログイン画面 */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      margin: 80px auto;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .login-card h2 { color: var(--accent-gold); margin-bottom: 20px; font-size: 1.5rem; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 5px; }
    .input-group input {
      width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #2a3b63;
      background: #0b1325; color: #fff; font-size: 1rem;
    }
    .btn-submit {
      width: 100%; padding: 12px; border: none; border-radius: 6px;
      background: var(--accent-gold); color: #000; font-weight: bold; font-size: 1rem;
      cursor: pointer; margin-top: 10px; transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; }

    /* ダッシュボード */
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: #fff; font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: var(--text-sub); font-size: 0.9rem; }

    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .section-title {
      color: var(--accent-gold);
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::before {
      content: ''; display: inline-block; width: 4px; height: 16px; background: var(--accent-gold); border-radius: 2px;
    }

    /* 指標グリッド */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 15px;
    }
    .metric-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .metric-label { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-value { font-size: 1.3rem; font-weight: bold; color: var(--accent-gold); }
    .metric-median { font-size: 0.7rem; color: var(--accent-blue); margin-top: 2px; }

    /* アコーディオン */
    .history-item {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .history-header {
      padding: 15px 20px;
      background: rgba(255,255,255,0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: bold;
      color: var(--accent-gold);
    }
    .history-header:hover { background: rgba(255,255,255,0.05); }
    .history-body { padding: 15px; display: none; border-top: 1px solid rgba(255,255,255,0.05); }
    .history-item.open .history-body { display: block; }

    /* ローダー */
    .loader {
      display: inline-block; width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
      border-top-color: var(--accent-gold); animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <!-- ログインビュー -->
    <div id="login-view" class="login-card">
      <h2>LUCERO KYOTO</h2>
      <p style="color:var(--text-sub); font-size:0.85rem; margin-bottom:20px;">フィジカルポータル ログイン</p>
      <div class="input-group">
        <label>ユーザーID または 選手名</label>
        <input type="text" id="userId" placeholder="例: KIPPEI または 辰己桔平">
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="パスワードを入力">
      </div>
      <button class="btn-submit" onclick="handleLogin()">ログイン</button>
      <div id="login-msg" style="color:#ef4444; font-size:0.85rem; margin-top:10px;"></div>
    </div>

    <!-- ダッシュボードビュー -->
    <div id="dashboard" class="hidden">
      <header>
        <h1 id="player-name-display">--- 選手</h1>
        <p>フィジカル測定データ & パフォーマンス変遷</p>
      </header>

      <!-- 最新の記録 -->
      <div class="section-card">
        <div class="section-title">LATEST RECORD ( <span id="latest-date">---</span> )</div>
        <div class="metrics-grid" id="latest-metrics">
          <!-- JSで動的挿入 -->
        </div>
      </div>

      <!-- 履歴一覧 -->
      <div class="section-card">
        <div class="section-title">MEASUREMENT HISTORY</div>
        <div id="history-container">
          <!-- JSで動的挿入 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // ★ご自身のGASデプロイURLに差し替えてください★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwc8G9J4d6dC2q82oE3r9GzF39aH_PqE9b1G8c7d_example/exec";

    async function handleLogin() {
      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('login-msg');

      if (!userId) {
        msg.textContent = "ユーザーIDまたは選手名を入力してください";
        return;
      }

      msg.textContent = "認証中...";

      try {
        // POST認証
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', userId: userId, password: password })
        });
        const result = await res.json();

        if (result.success) {
          msg.textContent = "";
          await loadData(userId);
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
        } else {
          msg.textContent = result.message || "ログインに失敗しました";
        }
      } catch (err) {
        console.error(err);
        // 通信失敗時でも直接データ取得を試行
        await loadData(userId);
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
      }
    }

    async function loadData(userId) {
      try {
        const res = await fetch(`${GAS_URL}?action=getData&userId=${encodeURIComponent(userId)}`);
        const data = await res.json();

        if (!data || !data.history || data.history.length === 0) {
          alert("該当する測定データが見つかりませんでした。");
          return;
        }

        // 選手名表示
        document.getElementById('player-name-display').textContent = `${data.name} 選手`;

        // 1. 最新データの表示
        const latest = data.history[0]; // 最初の要素を最新とする
        document.getElementById('latest-date').textContent = latest.date;
        renderMetrics('latest-metrics', latest.metrics, latest.medians, latest.medianLabel);

        // 2. 過去履歴の表示
        const historyContainer = document.getElementById('history-container');
        historyContainer.innerHTML = '';

        data.history.forEach((item, index) => {
          const itemEl = document.createElement('div');
          itemEl.className = `history-item ${index === 0 ? 'open' : ''}`;
          
          itemEl.innerHTML = `
            <div class="history-header" onclick="toggleAccordion(this)">
              <span>${item.date}</span>
              <span class="icon">${index === 0 ? '−' : '＋'}</span>
            </div>
            <div class="history-body">
              <div class="metrics-grid" id="history-grid-${index}"></div>
            </div>
          `;
          historyContainer.appendChild(itemEl);

          renderMetrics(`history-grid-${index}`, item.metrics, item.medians, item.medianLabel);
        });

      } catch (e) {
        console.error("Data Load Error:", e);
        alert("データ読み込み中にエラーが発生しました。");
      }
    }

    // 指標カードの描画処理
    function renderMetrics(containerId, metrics, medians, medianLabel) {
      const container = document.getElementById(containerId);
      if (!container || !metrics) return;

      container.innerHTML = '';
      const labelText = medianLabel || '期別中央値';

      Object.keys(metrics).forEach(key => {
        const val = metrics[key];
        // 名前やID項目、空データはスキップ
        if (key.includes('名前') || key.includes('ID') || key.includes('氏名') || val === '' || val === undefined) return;

        const medianVal = (medians && medians[key] !== undefined) ? medians[key] : '-';

        const box = document.createElement('div');
        box.className = 'metric-box';
        box.innerHTML = `
          <div class="metric-label" title="${key}">${key}</div>
          <div class="metric-value">${formatVal(val)}</div>
          <div class="metric-median">${labelText}: ${formatVal(medianVal)}</div>
        `;
        container.appendChild(box);
      });
    }

    function formatVal(val) {
      if (val === null || val === undefined || val === '') return '-';
      if (typeof val === 'number') {
        return Number.isInteger(val) ? val : val.toFixed(1);
      }
      return val;
    }

    function toggleAccordion(header) {
      const parent = header.parentElement;
      const icon = header.querySelector('.icon');
      parent.classList.toggle('open');
      if (parent.classList.contains('open')) {
        icon.textContent = '−';
      } else {
        icon.textContent = '＋';
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO Physical Data Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --lucero-navy: #0B192C;
      --lucero-gold: #FFD700;
      --lucero-gold-hover: #E6C200;
      --lucero-light-bg: #F4F6F9;
      --lucero-text: #1E293B;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'ヒラギノ角ゴ Pro W3', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--lucero-navy);
      color: #ffffff;
      line-height: 1.6;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      color: var(--lucero-text);
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border-top: 4px solid var(--lucero-gold);
    }

    h1, h2, h3 {
      color: var(--lucero-navy);
      margin-top: 0;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      max-width: 320px;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      box-sizing: border-box;
      display: block;
      font-size: 14px;
    }

    button {
      background-color: var(--lucero-gold);
      color: var(--lucero-navy);
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--lucero-gold-hover);
      transform: translateY(-1px);
    }

    details {
      background: var(--lucero-light-bg);
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--lucero-navy);
    }

    summary {
      cursor: pointer;
      font-weight: bold;
      color: var(--lucero-navy);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .metric-item {
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #E2E8F0;
      font-size: 13px;
    }

    .metric-label {
      font-weight: bold;
      color: #64748B;
      display: block;
    }

    .metric-value {
      font-size: 16px;
      color: var(--lucero-navy);
      font-weight: bold;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- ログイン画面 -->
    <div id="login-view" class="card">
      <h2>LUCERO 選手ログイン</h2>
      <input type="text" id="userId" placeholder="ユーザーID">
      <input type="password" id="password" placeholder="パスワード">
      <button onclick="handleLogin()">ログイン</button>
    </div>

    <!-- ダッシュボード画面 -->
    <div id="dashboard" class="hidden">
      <h1 id="welcome-msg" style="color: #ffffff;"></h1>

      <!-- 最新の記録 -->
      <div class="card">
        <h2>最新の記録 (<span id="latest-date">-</span>)</h2>
        <div id="latest-metrics" class="metric-grid"></div>
      </div>

      <!-- 過去の記録（アコーディオン） -->
      <div class="card">
        <h2>過去の記録一覧</h2>
        <div id="history-accordion"></div>
      </div>

      <!-- 成績の変遷（グラフ） -->
      <div class="card">
        <h2>成績の変遷（グラフ）</h2>
        <label for="metricSelect" style="font-weight: bold; font-size: 14px;">表示種目を選択:</label>
        <select id="metricSelect" onchange="updateChart()"></select>
        <canvas id="growthChart"></canvas>
      </div>
    </div>

  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycby_butvXxqK1Jszi37nZE97DVATb8IXVNT3ncGeuqBIrJARWk2vImctf7FF-dFVaX99/exec"; 
  let playerData = null;

  async function handleLogin() {
    const userId = document.getElementById('userId').value;
    const password = document.getElementById('password').value;

    if(!userId || !password) {
      alert("IDとパスワードを入力してください");
      return;
    }

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', userId, password })
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadDashboardData(userId);
      } else {
        alert(result.message);
      }
    } catch(e) {
      alert("通信エラーが発生しました");
    }
  }

  async function loadDashboardData(userId) {
    try {
      const res = await fetch(`${GAS_URL}?action=getData&userId=${userId}`);
      playerData = await res.json();

      if (playerData.error) {
        alert(playerData.error);
        return;
      }

      document.getElementById('welcome-msg').innerText = `${playerData.name} 選手のフィジカルデータ`;

      if (playerData.history && playerData.history.length > 0) {
        renderLatest(playerData.history[0]);
        renderAccordion(playerData.history);
        setupMetricSelect(playerData.history);
      } else {
        document.getElementById('latest-metrics').innerHTML = '<p style="color: #666;">測定データが登録されていません。</p>';
        document.getElementById('history-accordion').innerHTML = '<p style="color: #666;">表示できる過去のデータはありません。</p>';
      }
    } catch(e) {
      console.error(e);
      alert("データの読み込みに失敗しました。");
    }
  }

  function renderLatest(latest) {
    document.getElementById('latest-date').innerText = latest.date;
    let html = '';
    for (let [key, val] of Object.entries(latest.metrics)) {
      html += `
        <div class="metric-item">
          <span class="metric-label">${key}</span>
          <span class="metric-value">${val}</span>
        </div>`;
    }
    document.getElementById('latest-metrics').innerHTML = html;
  }

  function renderAccordion(history) {
    let html = '';
    history.forEach(item => {
      html += `<details><summary>${item.date}</summary><div class="metric-grid">`;
      for (let [key, val] of Object.entries(item.metrics)) {
        html += `
          <div class="metric-item">
            <span class="metric-label">${key}</span>
            <span class="metric-value">${val}</span>
          </div>`;
      }
      html += `</div></details>`;
    });
    document.getElementById('history-accordion').innerHTML = html;
  }

  // 数値化可能な種目（グラフ表示用）を判別してセレクトボックスを作成
  function setupMetricSelect(history) {
    const select = document.getElementById('metricSelect');
    select.innerHTML = '';

    let numericKeys = new Set();
    history.forEach(h => {
      for (let [key, val] of Object.entries(h.metrics)) {
        if (!isNaN(parseFloat(val)) && isFinite(val)) {
          numericKeys.add(key);
        }
      }
    });

    if (numericKeys.size === 0) {
      select.innerHTML = '<option>グラフ表示できる数値データがありません</option>';
      return;
    }

    numericKeys.forEach(key => {
      let opt = document.createElement('option');
      opt.value = key;
      opt.innerText = key;
      select.appendChild(opt);
    });

    updateChart();
  }

  function updateChart() {
    const selectedMetric = document.getElementById('metricSelect').value;
    if (!selectedMetric || !playerData || !playerData.history) return;

    const reversedHistory = [...playerData.history].reverse();
    const labels = [];
    const dataPoints = [];

    reversedHistory.forEach(h => {
      if (h.metrics[selectedMetric] !== undefined && !isNaN(parseFloat(h.metrics[selectedMetric]))) {
        labels.push(h.date);
        dataPoints.push(parseFloat(h.metrics[selectedMetric]));
      }
    });

    renderChart(selectedMetric, labels, dataPoints);
  }

  function renderChart(metricName, labels, dataPoints) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    
    if (window.myChart) {
      window.myChart.destroy();
    }

    window.myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: metricName,
          data: dataPoints,
          borderColor: '#0B192C',         /* ルセーロネイビー */
          backgroundColor: 'rgba(255, 215, 0, 0.2)', /* ルセーロゴールド */
          pointBackgroundColor: '#FFD700',
          pointBorderColor: '#0B192C',
          pointRadius: 6,
          fill: true,
          tension: 0.2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: {
              color: '#0B192C',
              font: { weight: 'bold' }
            }
          }
        },
        scales: {
          y: {
            beginAtZero: false
          }
        }
      }
    });
  }
</script>
</body>
</html>

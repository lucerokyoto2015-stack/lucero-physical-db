<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO | Physical Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+JP:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #070D18;
      --bg-card: rgba(15, 23, 42, 0.75);
      --lucero-navy: #0B192C;
      --lucero-gold: #FFD700;
      --lucero-gold-glow: rgba(255, 215, 0, 0.35);
      --lucero-gold-dark: #CFA600;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --border-glow: rgba(255, 215, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top center, #11223A 0%, var(--bg-dark) 70%);
      min-height: 100vh;
      color: var(--text-main);
      line-height: 1.6;
    }

    /* ヘッダー */
    header {
      text-align: center;
      padding: 30px 20px 10px;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--lucero-gold);
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--lucero-gold-glow);
      margin: 0;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ガラスモフィズムカード */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--lucero-gold), transparent);
    }

    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 0;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--lucero-gold);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--lucero-gold);
    }

    /* 入力フォーム & ボタン */
    .input-group {
      margin-bottom: 16px;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(7, 13, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus, select:focus {
      border-color: var(--lucero-gold);
      box-shadow: 0 0 12px var(--lucero-gold-glow);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--lucero-gold) 0%, var(--lucero-gold-dark) 100%);
      color: #070D18;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--lucero-gold-glow);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
    }

    /* アコーディオン */
    details {
      background: rgba(11, 25, 44, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      margin-bottom: 12px;
      padding: 14px 16px;
      transition: all 0.2s;
    }

    details[open] {
      border-color: var(--border-glow);
      background: rgba(11, 25, 44, 0.9);
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--lucero-gold);
      font-size: 15px;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: '＋';
      font-size: 16px;
      color: var(--text-sub);
    }

    details[open] summary::after {
      content: '－';
      color: var(--lucero-gold);
    }

    /* グリッドレイアウト（項目表示） */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .metric-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
    }

    /* 〇✕判定バッジ */
    .badge-ok {
      color: #070D18;
      background: var(--lucero-gold);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 900;
      display: inline-block;
      box-shadow: 0 0 8px var(--lucero-gold-glow);
      width: fit-content;
    }

    .badge-ng {
      color: #94A3B8;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      display: inline-block;
      width: fit-content;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">LUCERO KYOTO</div>
    <div class="brand-subtitle">Physical Data Analytics Portal</div>
  </header>

  <div class="container">
    
    <!-- ログイン画面 -->
    <div id="login-view" class="card" style="max-width: 400px; margin: 40px auto;">
      <h2 style="justify-content: center;">ATHLETE LOGIN</h2>
      <div class="input-group">
        <input type="text" id="userId" placeholder="ユーザーID (選手ID)">
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="パスワード">
      </div>
      <button onclick="handleLogin()">ログイン</button>
    </div>

    <!-- ダッシュボード画面 -->
    <div id="dashboard" class="hidden">
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 id="welcome-msg" style="font-size: 24px; color: #FFFFFF; margin: 0; font-weight: 900;"></h1>
        <p style="color: var(--text-sub); font-size: 13px; margin-top: 4px;">フィジカル測定データ & パフォーマンス変遷</p>
      </div>

      <!-- 最新の記録 -->
      <div class="card">
        <h2>LATEST RECORD (<span id="latest-date" style="color: var(--lucero-gold);">-</span>)</h2>
        <div id="latest-metrics" class="metric-grid"></div>
      </div>

      <!-- 過去の記録（アコーディオン） -->
      <div class="card">
        <h2>MEASUREMENT HISTORY</h2>
        <div id="history-accordion"></div>
      </div>

      <!-- 成績の変遷（グラフ） -->
      <div class="card">
        <h2>PERFORMANCE CHART</h2>
        <div class="input-group">
          <label for="metricSelect" style="font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px;">表示項目を選択</label>
          <select id="metricSelect" onchange="updateChart()"></select>
        </div>
        <div style="position: relative; height: 300px; margin-top: 15px;">
          <canvas id="growthChart"></canvas>
        </div>
      </div>
    </div>

  </div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycby_butvXxqK1Jszi37nZE97DVATb8IXVNT3ncGeuqBIrJARWk2vImctf7FF-dFVaX99/exec"; 
  let playerData = null;

  async function handleLogin() {
    const userId = document.getElementById('userId').value;
    const password = document.getElementById('password').value;

    if(!userId || !password) {
      alert("IDとパスワードを入力してください");
      return;
    }

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', userId, password })
      });
      const result = await res.json();

      if (result.success) {
        document.getElementById('login-view').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadDashboardData(userId);
      } else {
        alert(result.message);
      }
    } catch(e) {
      alert("通信エラーが発生しました");
    }
  }

  async function loadDashboardData(userId) {
    try {
      const res = await fetch(`${GAS_URL}?action=getData&userId=${userId}`);
      playerData = await res.json();

      if (playerData.error) {
        alert(playerData.error);
        return;
      }

      document.getElementById('welcome-msg').innerText = `${playerData.name} 選手`;

      if (playerData.history && playerData.history.length > 0) {
        renderLatest(playerData.history[0]);
        renderAccordion(playerData.history);
        setupMetricSelect(playerData.history);
      } else {
        document.getElementById('latest-metrics').innerHTML = '<p style="color: var(--text-sub);">測定データが登録されていません。</p>';
        document.getElementById('history-accordion').innerHTML = '<p style="color: var(--text-sub);">表示できる過去のデータはありません。</p>';
      }
    } catch(e) {
      console.error(e);
      alert("データの読み込みに失敗しました。");
    }
  }

  function formatValue(val) {
    if (val === '○' || val === '◯') {
      return '<span class="badge-ok">CLEAR</span>';
    } else if (val === '×') {
      return '<span class="badge-ng">NO CLEAR</span>';
    }
    return val;
  }

  function renderLatest(latest) {
    document.getElementById('latest-date').innerText = latest.date;
    let html = '';
    for (let [key, val] of Object.entries(latest.metrics)) {
      html += `
        <div class="metric-item">
          <span class="metric-label">${key}</span>
          <span class="metric-value">${formatValue(val)}</span>
        </div>`;
    }
    document.getElementById('latest-metrics').innerHTML = html;
  }

  function renderAccordion(history) {
    let html = '';
    history.forEach(item => {
      html += `<details><summary>${item.date}</summary><div class="metric-grid">`;
      for (let [key, val] of Object.entries(item.metrics)) {
        html += `
          <div class="metric-item">
            <span class="metric-label">${key}</span>
            <span class="metric-value">${formatValue(val)}</span>
          </div>`;
      }
      html += `</div></details>`;
    });
    document.getElementById('history-accordion').innerHTML = html;
  }

  function setupMetricSelect(history) {
    const select = document.getElementById('metricSelect');
    select.innerHTML = '';

    let numericKeys = new Set();
    history.forEach(h => {
      for (let [key, val] of Object.entries(h.metrics)) {
        if (!isNaN(parseFloat(val)) && isFinite(val)) {
          numericKeys.add(key);
        }
      }
    });

    if (numericKeys.size === 0) {
      select.innerHTML = '<option>グラフ表示できる数値データがありません</option>';
      return;
    }

    numericKeys.forEach(key => {
      let opt = document.createElement('option');
      opt.value = key;
      opt.innerText = key;
      select.appendChild(opt);
    });

    updateChart();
  }

  function updateChart() {
    const selectedMetric = document.getElementById('metricSelect').value;
    if (!selectedMetric || !playerData || !playerData.history) return;

    // 最新順から古い順（昇順）に変換して、左から右へ最新の日付になるように配置
    const chronologicalHistory = [...playerData.history].reverse();
    const labels = [];
    const dataPoints = [];

    chronologicalHistory.forEach(h => {
      if (h.metrics[selectedMetric] !== undefined && !isNaN(parseFloat(h.metrics[selectedMetric]))) {
        labels.push(h.date);
        dataPoints.push(parseFloat(h.metrics[selectedMetric]));
      }
    });

    renderChart(selectedMetric, labels, dataPoints);
  }

  function renderChart(metricName, labels, dataPoints) {
    const ctx = document.getElementById('growthChart').getContext('2d');
    
    if (window.myChart) {
      window.myChart.destroy();
    }

    window.myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: metricName,
          data: dataPoints,
          borderColor: '#FFD700',
          backgroundColor: 'rgba(255, 215, 0, 0.15)',
          pointBackgroundColor: '#FFD700',
          pointBorderColor: '#070D18',
          pointBorderWidth: 2,
          pointRadius: 6,
          pointHoverRadius: 8,
          fill: true,
          tension: 0.35
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: {
              color: '#FFFFFF',
              font: { family: 'Noto Sans JP', weight: 'bold' }
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(255, 255, 255, 0.05)' },
            ticks: { color: '#94A3B8' }
          },
          y: {
            grid: { color: 'rgba(255, 255, 255, 0.08)' },
            ticks: { color: '#94A3B8' },
            beginAtZero: false
          }
        }
      }
    });
  }
</script>
</body>
</html>

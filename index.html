<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO | Physical Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0B121E;
      --bg-card: rgba(15, 23, 38, 0.85);
      --lucero-gold: #FFD700;
      --text-main: #FFFFFF;
      --text-sub: #94A3B8;
      --border-card: rgba(255, 215, 0, 0.2);
      --border-item: rgba(255, 255, 255, 0.08);
      --bg-item: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top center, #111C2E 0%, var(--bg-dark) 80%);
      min-height: 100vh;
      color: var(--text-main);
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    .site-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .site-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: var(--lucero-gold);
      letter-spacing: 2px;
      margin: 0;
    }

    .site-subtitle {
      font-size: 11px;
      color: var(--text-sub);
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .login-container {
      max-width: 400px;
      margin: 40px auto 0 auto;
    }

    .login-input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-item);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
    }

    .login-input:focus {
      border-color: var(--lucero-gold);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--lucero-gold);
      color: #0F1726;
      border: none;
      border-radius: 8px;
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .section-title {
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--lucero-gold);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--lucero-gold);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 900;
      font-size: 12px;
    }

    .badge-ok {
      color: #070D18;
      background: var(--lucero-gold);
    }

    .badge-ng {
      color: #94A3B8;
      background: rgba(255, 255, 255, 0.1);
    }

    .data-table-container {
      overflow-x: auto;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      color: #FFFFFF;
      text-align: center;
    }

    .history-table th, .history-table td {
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      white-space: nowrap;
    }

    .history-table th {
      background: rgba(255, 215, 0, 0.15);
      color: var(--lucero-gold);
      font-weight: 700;
    }

    .history-table tbody tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(7, 13, 24, 0.9);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .ball-spinner {
      font-size: 56px;
      animation: spinBall 1.2s linear infinite;
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: var(--lucero-gold);
      margin-top: 10px;
    }

    @keyframes spinBall {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="site-header">
      <h1 class="site-title">LUCERO KYOTO</h1>
      <div class="site-subtitle">PHYSICAL DATA ANALYTICS PORTAL</div>
    </div>

    <!-- ATHLETE LOGIN -->
    <div class="card login-container">
      <h2 class="section-title">ATHLETE LOGIN</h2>
      <form id="login-form">
        <input type="text" id="user-id" class="login-input" placeholder="ユーザーID (または選手名)" required>
        <input type="password" id="password" class="login-input" placeholder="パスワード" required>
        <button type="submit" class="login-btn">ログイン</button>
      </form>
    </div>
  </div>

</body>
</html>

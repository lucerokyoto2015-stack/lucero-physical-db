<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO | Physical Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0B121E;
      --bg-card: rgba(15, 23, 38, 0.85);
      --lucero-gold: #FFD700;
      --lucero-gold-glow: rgba(255, 215, 0, 0.35);
      --text-main: #FFFFFF;
      --text-sub: #94A3B8;
      --border-card: rgba(255, 215, 0, 0.2);
      --border-item: rgba(255, 255, 255, 0.08);
      --bg-item: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top center, #111C2E 0%, var(--bg-dark) 80%);
      min-height: 100vh;
      color: var(--text-main);
      line-height: 1.5;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 16px;
    }

    /* Card Wrapper */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Section Header */
    .section-title {
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--lucero-gold);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--lucero-gold);
    }

    .date-highlight {
      color: var(--lucero-gold);
      margin: 0 4px;
    }

    /* Metrics Grid */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    @media (max-width: 768px) {
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .metric-item {
      background: var(--bg-item);
      border: 1px solid var(--border-item);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 72px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value-container {
      display: flex;
      align-items: center;
      min-height: 28px;
    }

    .metric-value-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
    }

    /* BADGES (CLEAR / NO CLEAR) */
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 12px;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
      min-width: 85px;
    }

    .badge-clear {
      background-color: #FFD700;
      color: #0F1726;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .badge-noclear {
      background-color: rgba(255, 255, 255, 0.12);
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Accordion (MEASUREMENT HISTORY) */
    .accordion-item {
      background: var(--bg-item);
      border: 1px solid var(--border-item);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .accordion-header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--lucero-gold);
      user-select: none;
      transition: background 0.2s;
    }

    .accordion-header:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .accordion-icon {
      font-size: 18px;
      color: var(--text-sub);
      transition: transform 0.3s ease;
    }

    .accordion-item.active .accordion-icon {
      transform: rotate(45deg); /* + が x に変わるアニメーション */
    }

    .accordion-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
      padding: 0 20px;
    }

    .accordion-item.active .accordion-body {
      padding: 10px 20px 20px 20px;
      max-height: 1000px;
    }

    /* Loading UI */
    #loading {
      text-align: center;
      padding: 50px;
      font-size: 16px;
      color: var(--lucero-gold);
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="loading">LOADING DATA...</div>

    <div id="app-content" style="display: none;">
      <!-- LATEST RECORD CARD -->
      <div class="card">
        <h2 class="section-title">
          LATEST RECORD ( <span id="latest-date" class="date-highlight">--</span> )
        </h2>
        <div id="latest-grid" class="metric-grid"></div>
      </div>

      <!-- MEASUREMENT HISTORY CARD -->
      <div class="card">
        <h2 class="section-title">MEASUREMENT HISTORY</h2>
        <div id="history-accordion"></div>
      </div>
    </div>
  </div>

  <script>
    // ★ 自身のGASウェブアプリURLを設定してください
    const GAS_URL = "YOUR_GAS_DEPLOY_URL_HERE"; 

    // CLEAR / NO CLEAR / 数値の表示整形関数
    function formatValueHtml(val) {
      if (val === undefined || val === null || val === '') return '-';
      
      if (val === 'CLEAR') {
        return '<span class="badge badge-clear">CLEAR</span>';
      }
      if (val === 'NO CLEAR' || val === 'NOT CLEAR' || val === 'NOTCLEAR' || val === 'NOCLEAR') {
        return '<span class="badge badge-noclear">NO CLEAR</span>';
      }

      if (typeof val === 'number') {
        return `<span class="metric-value-text">${Number.isInteger(val) ? val : val.toFixed(2)}</span>`;
      }

      return `<span class="metric-value-text">${val}</span>`;
    }

    // 最新非空値の取得（カード表示用）
    function getLatestValue(history, metricKey) {
      for (let i = history.length - 1; i >= 0; i--) {
        const val = history[i].metrics[metricKey];
        if (val !== undefined && val !== null && val !== '') {
          return val;
        }
      }
      return null;
    }

    // アコーディオンのトグル制御
    function toggleAccordion(element) {
      const item = element.parentElement;
      item.classList.toggle('active');
    }

    // 画面描画
    function renderApp(data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';

      if (!data || !data.history || data.history.length === 0) {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('loading').textContent = 'NO DATA FOUND';
        document.getElementById('app-content').style.display = 'none';
        return;
      }

      const history = data.history;
      const latestData = history[history.length - 1];

      // 日付セット
      document.getElementById('latest-date').textContent = latestData.date;

      // ヘッダー項目の一覧抽出
      const allHeaders = new Set();
      history.forEach(item => {
        Object.keys(item.metrics).forEach(key => allHeaders.add(key));
      });
      const headerList = Array.from(allHeaders);

      // 1. LATEST RECORD グリッド生成
      const latestGrid = document.getElementById('latest-grid');
      latestGrid.innerHTML = '';

      headerList.forEach(header => {
        const val = getLatestValue(history, header);
        const itemDiv = document.createElement('div');
        itemDiv.className = 'metric-item';
        itemDiv.innerHTML = `
          <div class="metric-label">${header}</div>
          <div class="metric-value-container">${formatValueHtml(val)}</div>
        `;
        latestGrid.appendChild(itemDiv);
      });

      // 2. MEASUREMENT HISTORY アコーディオン生成 (降順表示)
      const historyAccordion = document.getElementById('history-accordion');
      historyAccordion.innerHTML = '';

      const reverseHistory = history.slice().reverse();

      reverseHistory.forEach((item, index) => {
        const accordionItem = document.createElement('div');
        accordionItem.className = `accordion-item ${index === 0 ? '' : ''}`;

        let gridHtml = '<div class="metric-grid">';
        headerList.forEach(header => {
          const val = item.metrics[header];
          gridHtml += `
            <div class="metric-item">
              <div class="metric-label">${header}</div>
              <div class="metric-value-container">${formatValueHtml(val)}</div>
            </div>
          `;
        });
        gridHtml += '</div>';

        accordionItem.innerHTML = `
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span>${item.date}</span>
            <span class="accordion-icon">+</span>
          </div>
          <div class="accordion-body">
            ${gridHtml}
          </div>
        `;

        historyAccordion.appendChild(accordionItem);
      });
    }

    // データ読み込み実行
    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('userId') || '1';

      fetch(`${GAS_URL}?action=getData&userId=${encodeURIComponent(userId)}`)
        .then(res => res.json())
        .then(data => renderApp(data))
        .catch(err => {
          console.error(err);
          document.getElementById('loading').textContent = 'ERROR LOADING DATA';
        });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

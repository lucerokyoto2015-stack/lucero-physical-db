<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO Physical Analytics</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0b1329;
      --card-bg: #111c38;
      --border-gold: #ffd700;
      --text-main: #ffffff;
      --text-sub: #a0aec0;
      --accent-gold: #ffcc00;
      --accent-blue: #3182ce;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid #1e2d52;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    /* 金色のグラデーション線枠 */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ffd700, transparent);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background-color: var(--border-gold);
    }

    /* 検索バー */
    .search-box {
      display: flex;
      gap: 12px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background-color: #0d162d;
      border: 1px solid #2a3b63;
      border-radius: 6px;
      color: white;
      font-size: 16px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--border-gold);
    }

    button {
      background: linear-gradient(135deg, #ffd700, #cca100);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    /* テーブルデザイン */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #1c2b4d;
      font-size: 14px;
    }

    th {
      background-color: #162345;
      color: var(--accent-gold);
      font-weight: bold;
    }

    tr:hover {
      background-color: #18284c;
    }

    /* グラフ・セレクトボックス */
    .select-box {
      margin-bottom: 16px;
    }

    select {
      padding: 8px 12px;
      background-color: #0d162d;
      color: white;
      border: 1px solid #2a3b63;
      border-radius: 6px;
      font-size: 14px;
    }

    .chart-container {
      position: relative;
      height: 350px;
      width: 100%;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 検索カード -->
    <div class="card">
      <div class="search-box">
        <input type="text" id="userIdInput" placeholder="選手ID または 氏名を入力">
        <button onclick="loadData()">検索 / 読込</button>
      </div>
      <div id="loading" class="loading">データ読み込み中...</div>
    </div>

    <div id="resultArea" style="display: none;">

      <!-- LATEST RECORD -->
      <div class="card">
        <div class="section-title">
          LATEST RECORD ( <span id="latestDate" style="color: var(--accent-gold);"></span> )
        </div>
        <div id="latestMetricsSummary" style="display: flex; flex-wrap: wrap; gap: 16px;">
          <!-- 最新データサマリーがここに動的挿入されます -->
        </div>
      </div>

      <!-- MEASUREMENT HISTORY -->
      <div class="card">
        <div class="section-title">MEASUREMENT HISTORY (全データ一覧)</div>
        <div class="table-container">
          <table>
            <thead>
              <tr id="tableHeader">
                <th>回数</th>
                <th>測定日</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- PERFORMANCE CHART -->
      <div class="card">
        <div class="section-title">PERFORMANCE CHART (個人値 vs 中央値)</div>
        <div class="select-box">
          <label for="metricSelect" style="color: var(--text-sub); margin-right: 8px;">表示項目:</label>
          <select id="metricSelect" onchange="updateChart()"></select>
        </div>
        <div class="chart-container">
          <canvas id="analyticsChart"></canvas>
        </div>
      </div>

    </div>

  </div>

  <script>
    // ★ GASのWebアプリURL ★
    const GAS_URL = "https://script.google.com/macros/s/AKfycby_butvXxqK1Jszi37nZE97DVATb8IXVNT3ncGeuqBIrJARWk2vImctf7FF-dFVaX99/exec";

    let currentPlayerData = null;
    let myChart = null;

    async function loadData() {
      const userId = document.getElementById("userIdInput").value.trim();
      const loading = document.getElementById("loading");
      const resultArea = document.getElementById("resultArea");

      if (!userId) {
        alert("選手IDまたは氏名を入力してください。");
        return;
      }

      loading.style.display = "block";
      resultArea.style.display = "none";

      try {
        const response = await fetch(`${GAS_URL}?action=getData&userId=${encodeURIComponent(userId)}`);
        
        if (!response.ok) {
          throw new Error(`通信エラー: ${response.status}`);
        }

        const data = await response.json();
        console.log("取得データ:", data);

        if (data.error) {
          alert("エラー: " + data.error);
          return;
        }

        if (!data || !data.history || !Array.isArray(data.history) || data.history.length === 0) {
          alert("該当するデータが見つかりませんでした。");
          return;
        }

        currentPlayerData = data;
        renderAll();

      } catch (err) {
        console.error(err);
        alert("データの読み込みに失敗しました。\n詳細: " + err.message);
      } finally {
        loading.style.display = "none";
      }
    }

    function renderAll() {
      if (!currentPlayerData || !currentPlayerData.history) return;

      const history = currentPlayerData.history;
      const resultArea = document.getElementById("resultArea");

      // 1. 最新データの取得
      const latestItem = history[history.length - 1];
      document.getElementById("latestDate").textContent = latestItem.date || "-";

      // 2. 利用可能な全測定項目（項目名）の抽出
      const metricKeys = new Set();
      history.forEach(item => {
        if (item.metrics) {
          Object.keys(item.metrics).forEach(k => metricKeys.add(k));
        }
      });
      const metricsList = Array.from(metricKeys);

      // 3. LATEST RECORD のカード描画
      const summaryElem = document.getElementById("latestMetricsSummary");
      summaryElem.innerHTML = "";
      metricsList.forEach(m => {
        const val = (latestItem.metrics && latestItem.metrics[m] !== undefined) ? latestItem.metrics[m] : "-";
        summaryElem.innerHTML += `
          <div style="background: #0d162d; border: 1px solid #2a3b63; padding: 12px; border-radius: 8px; flex: 1; min-width: 140px; text-align: center;">
            <div style="font-size: 12px; color: var(--text-sub);">${m}</div>
            <div style="font-size: 20px; font-weight: bold; color: var(--accent-gold); margin-top: 4px;">${val}</div>
          </div>
        `;
      });

      // 4. テーブル描画
      renderTable(metricsList);

      // 5. ドロップダウン＆グラフ描画
      const selectElem = document.getElementById("metricSelect");
      selectElem.innerHTML = "";
      metricsList.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        selectElem.appendChild(opt);
      });

      updateChart();

      resultArea.style.display = "block";
    }

    function renderTable(metricsList) {
      const headerRow = document.getElementById("tableHeader");
      const tableBody = document.getElementById("tableBody");

      // テーブルヘッダーの組み立て
      headerRow.innerHTML = "<th>回数</th><th>測定日</th>";
      metricsList.forEach(m => {
        headerRow.innerHTML += `<th>${m}</th>`;
      });

      // テーブルボディの組み立て
      tableBody.innerHTML = "";
      currentPlayerData.history.forEach((item, index) => {
        let tr = `<tr>
          <td style="color: var(--accent-gold); font-weight: bold;">第 ${index + 1} 回</td>
          <td>${item.date || '-'}</td>`;
        
        metricsList.forEach(m => {
          const val = (item.metrics && item.metrics[m] !== undefined) ? item.metrics[m] : "-";
          tr += `<td>${val}</td>`;
        });

        tr += "</tr>";
        tableBody.innerHTML += tr;
      });
    }

    function updateChart() {
      if (!currentPlayerData || !currentPlayerData.history) return;

      const selectedMetric = document.getElementById("metricSelect").value;
      const labels = [];
      const playerValues = [];
      const medianValues = [];

      currentPlayerData.history.forEach((item, index) => {
        labels.push(`第${index + 1}回 (${item.date})`);

        const val = (item.metrics && item.metrics[selectedMetric] !== undefined) ? item.metrics[selectedMetric] : "-";
        const medVal = (item.medians && item.medians[selectedMetric] !== undefined) ? item.medians[selectedMetric] : "-";

        playerValues.push((val !== "-" && !isNaN(val)) ? parseFloat(val) : null);
        medianValues.push((medVal !== "-" && !isNaN(medVal)) ? parseFloat(medVal) : null);
      });

      if (myChart) {
        myChart.destroy();
      }

      const ctx = document.getElementById("analyticsChart").getContext("2d");
      myChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [
            {
              label: "個人値",
              data: playerValues,
              borderColor: "#ffd700",
              backgroundColor: "rgba(255, 215, 0, 0.1)",
              borderWidth: 2,
              pointRadius: 4,
              tension: 0.2,
              spanGaps: true
            },
            {
              label: "チーム中央値",
              data: medianValues,
              borderColor: "#a0aec0",
              borderDash: [4, 4],
              borderWidth: 1.5,
              pointRadius: 2,
              tension: 0.2,
              spanGaps: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: { color: "#ffffff" }
            }
          },
          scales: {
            x: {
              ticks: { color: "#a0aec0" },
              grid: { color: "#1c2b4d" }
            },
            y: {
              ticks: { color: "#a0aec0" },
              grid: { color: "#1c2b4d" }
            }
          }
        }
      });
    }
  </script>
</body>
</html>

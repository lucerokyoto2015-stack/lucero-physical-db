<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCERO KYOTO | Physical Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Chart.js 読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #0B121E;
      --bg-card: rgba(15, 23, 38, 0.85);
      --lucero-gold: #FFD700;
      --text-main: #FFFFFF;
      --text-sub: #94A3B8;
      --border-card: rgba(255, 215, 0, 0.2);
      --border-item: rgba(255, 255, 255, 0.08);
      --bg-item: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top center, #111C2E 0%, var(--bg-dark) 80%);
      min-height: 100vh;
      color: var(--text-main);
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 12px;
    }

    .site-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .site-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: var(--lucero-gold);
      letter-spacing: 2px;
      margin: 0;
    }

    .site-subtitle {
      font-size: 10px;
      color: var(--text-sub);
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .login-container {
      max-width: 400px;
      margin: 40px auto 0 auto;
    }

    .login-input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-item);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
    }

    .login-input:focus {
      border-color: var(--lucero-gold);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--lucero-gold);
      color: #0F1726;
      border: none;
      border-radius: 8px;
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: #F87171;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
    }

    .section-title {
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 0 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--lucero-gold);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--lucero-gold);
    }

    .date-highlight {
      color: var(--lucero-gold);
      margin: 0 4px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 768px) {
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .metric-item {
      background: var(--bg-item);
      border: 1px solid var(--border-item);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 64px;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-sub);
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-value-container {
      display: flex;
      align-items: center;
      min-height: 24px;
    }

    .metric-value-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
      min-width: 68px;
    }

    .badge-clear {
      background-color: #FFD700;
      color: #0F1726;
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
    }

    .badge-noclear {
      background-color: rgba(255, 255, 255, 0.12);
      color: #94A3B8;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* 一覧テーブル */
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border-item);
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      white-space: nowrap;
    }

    .history-table th, .history-table td {
      padding: 6px 10px;
      text-align: center;
      border-bottom: 1px solid var(--border-item);
    }

    .history-table th {
      background: rgba(255, 215, 0, 0.08);
      color: var(--lucero-gold);
      font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
      font-weight: 700;
      font-size: 10px;
    }

    .history-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    /* グラフ配置エリア */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 768px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      background: var(--bg-item);
      border: 1px solid var(--border-item);
      border-radius: 8px;
      padding: 12px;
    }

    .chart-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--lucero-gold);
      margin-bottom: 8px;
      text-align: center;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
    }

    #loading {
      text-align: center;
      padding: 50px;
      font-size: 16px;
      color: var(--lucero-gold);
      font-family: 'Orbitron', sans-serif;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="site-header">
      <h1 class="site-title">LUCERO KYOTO</h1>
      <div class="site-subtitle">PHYSICAL DATA ANALYTICS PORTAL</div>
    </div>

    <!-- ATHLETE LOGIN -->
    <div id="login-view" class="card login-container" style="display: block;">
      <h2 class="section-title">ATHLETE LOGIN</h2>
      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="text" id="user-id" class="login-input" placeholder="ユーザーID (または選手名)" required>
        <input type="password" id="password" class="login-input" placeholder="パスワード" required>
        <button type="submit" class="login-btn">ログイン</button>
      </form>
      <div id="login-error" class="error-msg"></div>
    </div>

    <!-- LOADING -->
    <div id="loading">LOADING DATA...</div>

    <!-- DASHBOARD -->
    <div id="app-content" style="display: none;">
      <!-- LATEST RECORD -->
      <div class="card">
        <h2 class="section-title">
          LATEST RECORD ( <span id="latest-date" class="date-highlight">--</span> )
        </h2>
        <div id="latest-grid" class="metric-grid"></div>
      </div>

      <!-- HISTORY TABLE -->
      <div class="card">
        <h2 class="section-title">MEASUREMENT HISTORY</h2>
        <div class="table-container">
          <table class="history-table" id="history-table">
            <thead id="history-thead"></thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- ANALYTICS CHARTS -->
      <div class="card">
        <h2 class="section-title">PERFORMANCE TRENDS</h2>
        <div id="charts-container" class="charts-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycby_butvXxqK1Jszi37nZE97DVATb8IXVNT3ncGeuqBIrJARWk2vImctf7FF-dFVaX99/exec";

    // グラフ表示対象の項目定義（BMIを追加）
    const TARGET_GRAPH_METRICS = [
      { keyKeywords: ["身長"], title: "身長 (cm)" },
      { keyKeywords: ["体重"], title: "体重 (kg)" },
      { keyKeywords: ["bmi", "ｂｍｉ"], title: "BMI" },
      { keyKeywords: ["立ち幅跳び", "立ち幅跳", "立ち幅"], title: "立ち幅跳び" },
      { keyKeywords: ["三段跳び", "三段跳", "三段飛び", "3段跳び", "3段跳", "3段飛び", "３段跳び", "３段跳", "３段飛び", "三段", "3段", "３段"], title: "三段跳び" },
      { keyKeywords: ["400m", "400"], title: "20mシャトル 400m" },
      { keyKeywords: ["800m", "800"], title: "20mシャトル 800m" }
    ];

    let chartInstances = [];

    // ヘッダー文字列の正規化（全角→半角、大文字→小文字、改行削除）
    function normalizeHeader(str) {
      if (!str) return '';
      return str
        .replace(/[\r\n]+/g, '')
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
          return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
        })
        .toLowerCase()
        .trim();
    }

    // 数値抽出関数（単位等の文字列が入っていても数値のみ抽出）
    function parseNumericValue(val) {
      if (val === undefined || val === null || val === '') return null;
      if (typeof val === 'number') return isNaN(val) ? null : val;
      
      let cleanStr = String(val).replace(/[０-９]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      });
      let match = cleanStr.match(/-?\d+(\.\d+)?/);
      if (match) {
        let num = parseFloat(match[0]);
        return isNaN(num) ? null : num;
      }
      return null;
    }

    function formatValueHtml(val) {
      if (val === undefined || val === null || val === '') return '-';
      
      let strVal = String(val).trim();
      if (strVal === 'CLEAR') {
        return '<span class="badge badge-clear">CLEAR</span>';
      }
      if (strVal === 'NO CLEAR' || strVal === 'NOT CLEAR' || strVal === 'NOTCLEAR' || strVal === 'NOCLEAR') {
        return '<span class="badge badge-noclear">NO CLEAR</span>';
      }

      let num = parseNumericValue(val);
      if (num !== null) {
        return `<span class="metric-value-text">${Number.isInteger(num) ? num : num.toFixed(2)}</span>`;
      }

      return `<span class="metric-value-text">${val}</span>`;
    }

    function getLatestValue(history, metricKey) {
      for (let i = history.length - 1; i >= 0; i--) {
        const val = history[i].metrics[metricKey];
        if (val !== undefined && val !== null && val !== '') {
          return val;
        }
      }
      return null;
    }

    function loadData(userId, password) {
      const loginView = document.getElementById('login-view');
      const loading = document.getElementById('loading');
      const loginError = document.getElementById('login-error');

      if (loginView) loginView.style.display = 'none';
      if (loading) loading.style.display = 'block';

      if (!GAS_URL || !GAS_URL.startsWith("http")) {
        if (loading) loading.style.display = 'none';
        if (loginView) loginView.style.display = 'block';
        if (loginError) loginError.textContent = 'GAS_URLの設定を確認してください。';
        return;
      }

      const requestUrl = `${GAS_URL}?action=getData&userId=${encodeURIComponent(userId)}&password=${encodeURIComponent(password || '')}`;

      fetch(requestUrl)
        .then(res => res.json())
        .then(data => {
          if (loading) loading.style.display = 'none';
          if (!data || !data.history || data.history.length === 0) {
            if (loginView) loginView.style.display = 'block';
            if (loginError) loginError.textContent = (data && data.message) ? data.message : '該当するデータが見つかりませんでした。';
            return;
          }
          renderApp(data);
        })
        .catch(err => {
          console.error('Fetch Error:', err);
          if (loading) loading.style.display = 'none';
          if (loginView) loginView.style.display = 'block';
          if (loginError) loginError.textContent = '通信エラーが発生しました。アクセス権限設定やネットワークを確認してください。';
        });
    }

    function handleLogin(event) {
      event.preventDefault();
      const userId = document.getElementById('user-id').value.trim();
      const password = document.getElementById('password').value.trim();
      if (userId) {
        document.getElementById('login-error').textContent = '';
        loadData(userId, password);
      }
    }

    function renderApp(data) {
      const appContent = document.getElementById('app-content');
      if (appContent) appContent.style.display = 'block';

      const history = data.history;
      const latestData = history[history.length - 1];

      const latestDateEl = document.getElementById('latest-date');
      if (latestDateEl) latestDateEl.textContent = latestData.date;

      const allHeaders = new Set();
      history.forEach(item => {
        Object.keys(item.metrics).forEach(key => allHeaders.add(key));
      });
      const headerList = Array.from(allHeaders);

      // 1. LATEST RECORD (GRID)
      const latestGrid = document.getElementById('latest-grid');
      if (latestGrid) {
        latestGrid.innerHTML = '';
        headerList.forEach(header => {
          const val = getLatestValue(history, header);
          const itemDiv = document.createElement('div');
          itemDiv.className = 'metric-item';
          itemDiv.innerHTML = `
            <div class="metric-label">${header.replace(/[\r\n]+/g, ' ')}</div>
            <div class="metric-value-container">${formatValueHtml(val)}</div>
          `;
          latestGrid.appendChild(itemDiv);
        });
      }

      // 2. MEASUREMENT HISTORY (TABLE)
      renderTable(history, headerList);

      // 3. CHARTS
      renderCharts(history, headerList, data.medians || {});
    }

    function renderTable(history, headerList) {
      const thead = document.getElementById('history-thead');
      const tbody = document.getElementById('history-tbody');
      
      thead.innerHTML = '';
      tbody.innerHTML = '';

      // Header Row
      let trHead = document.createElement('tr');
      let thDate = document.createElement('th');
      thDate.textContent = '測定日';
      trHead.appendChild(thDate);

      headerList.forEach(header => {
        let th = document.createElement('th');
        th.textContent = header.replace(/[\r\n]+/g, ' ');
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);

      // Body Rows
      const reverseHistory = history.slice().reverse();
      reverseHistory.forEach(item => {
        let tr = document.createElement('tr');
        
        let tdDate = document.createElement('td');
        tdDate.style.fontWeight = '700';
        tdDate.style.color = '#FFD700';
        tdDate.textContent = item.date;
        tr.appendChild(tdDate);

        headerList.forEach(header => {
          let td = document.createElement('td');
          const val = item.metrics[header];
          td.innerHTML = formatValueHtml(val);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    function renderCharts(history, headerList, mediansData) {
      const container = document.getElementById('charts-container');
      container.innerHTML = '';

      // 既存チャートのクリア
      chartInstances.forEach(chart => chart.destroy());
      chartInstances = [];

      const dates = history.map(h => h.date);

      TARGET_GRAPH_METRICS.forEach(target => {
        // キーワード照合（改行・全角半角・大文字小文字を考慮してマッチング）
        const matchedHeader = headerList.find(h => {
          const normH = normalizeHeader(h);
          return target.keyKeywords.some(kw => normH.includes(normalizeHeader(kw)));
        });

        if (!matchedHeader) return;

        // 本人データの抽出
        const userValues = history.map(h => {
          const val = h.metrics[matchedHeader];
          return parseNumericValue(val);
        });

        // 期生中央値の抽出
        const medianValues = history.map(h => {
          if (mediansData && mediansData[h.date] && mediansData[h.date][matchedHeader] !== undefined) {
            return parseNumericValue(mediansData[h.date][matchedHeader]);
          }
          return null;
        });

        // 有効な数値データがない場合はスキップ
        if (!userValues.some(v => v !== null)) return;

        // DOM構築
        const chartCard = document.createElement('div');
        chartCard.className = 'chart-card';
        
        const title = document.createElement('div');
        title.className = 'chart-title';
        title.textContent = matchedHeader.replace(/[\r\n]+/g, ' ');
        
        const wrapper = document.createElement('div');
        wrapper.className = 'chart-wrapper';
        
        const canvas = document.createElement('canvas');
        wrapper.appendChild(canvas);
        chartCard.appendChild(title);
        chartCard.appendChild(wrapper);
        container.appendChild(chartCard);

        const ctx = canvas.getContext('2d');
        const datasets = [
          {
            label: '本人成績',
            data: userValues,
            borderColor: '#FFD700',
            backgroundColor: 'rgba(255, 215, 0, 0.2)',
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 4,
            pointBackgroundColor: '#FFD700',
            spanGaps: true
          }
        ];

        if (medianValues.some(v => v !== null)) {
          datasets.push({
            label: '期生中央値',
            data: medianValues,
            borderColor: '#38BDF8',
            borderDash: [4, 4],
            backgroundColor: 'transparent',
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 3,
            pointBackgroundColor: '#38BDF8',
            spanGaps: true
          });
        }

        const chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: dates,
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { color: '#94A3B8', font: { family: 'Noto Sans JP', size: 10 } }
              }
            },
            scales: {
              x: {
                ticks: { color: '#94A3B8', font: { size: 10 } },
                grid: { color: 'rgba(255, 255, 255, 0.05)' }
              },
              y: {
                ticks: { color: '#94A3B8', font: { size: 10 } },
                grid: { color: 'rgba(255, 255, 255, 0.05)' }
              }
            }
          }
        });

        chartInstances.push(chart);
      });
    }
  </script>
</body>
</html>
